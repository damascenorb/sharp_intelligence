<style>
body { background: #f3f5fc; color: #0a1030; }
.hd { background: rgba(255,255,255,.92); border-bottom: 1px solid #dfe4f5; }
.hd .brand { color: #0a1030; }
.adm { padding-block: 40px 80px; }
.adm h1 { font-size: clamp(1.7rem, 1.2rem + 1.8vw, 2.4rem); color: #0a1030; }
.sub, .muted { color: #4a5478; }
.box { background: #fff; border: 1px solid #dfe4f5; border-radius: 18px; padding: 24px; max-width: 420px; box-shadow: 0 24px 50px rgba(10,16,48,.08); }
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field label, .lbl, .fl { font-weight: 700; font-size: .9rem; color: #0a1030; }
.inp { font: inherit; padding: 11px 14px; border-radius: 12px; border: 1px solid #dfe4f5; background: #fff; color: #0a1030; min-height: 44px; width: 100%; }
.inp:focus { outline: 2px solid #2f6bff; outline-offset: 1px; }
textarea.inp { min-height: 88px; resize: vertical; }
.err { color: #b42318; min-height: 1.4em; margin-bottom: 8px; }
.ok { color: #1b7f3a; min-height: 1.4em; margin-top: 8px; }
.bar { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; justify-content: space-between; margin-bottom: 20px; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tools .inp { width: 230px; }
.btn-s { font: inherit; font-weight: 700; padding: 10px 18px; border-radius: 999px; border: 1px solid #dfe4f5; background: #fff; color: #0a1030; cursor: pointer; min-height: 44px; }
.btn-s:hover { border-color: #2f6bff; color: #2f6bff; }
.btn-d { color: #b42318; border-color: #f0c4c0; }
.btn-d.confirma { background: #b42318; color: #fff; border-color: #b42318; }
.btn-p { font: inherit; font-weight: 700; padding: 11px 22px; border-radius: 999px; border: 0; background: #2f6bff; color: #fff; cursor: pointer; min-height: 44px; }
.btn-p:disabled { opacity: .6; cursor: default; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: min(340px, 84vw); gap: 14px; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 14px; align-items: start; }
.col { background: #e8ecf8; border: 1px solid #dfe4f5; border-radius: 16px; display: flex; flex-direction: column; scroll-snap-align: start; min-width: 0; }
.col-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 16px; border-radius: 16px 16px 0 0; background: var(--c); color: var(--t); }
.col-h h2 { font-size: 1rem; }
.col-h .acoes { display: flex; align-items: center; gap: 8px; }
.count { background: rgba(255,255,255,.3); border-radius: 999px; padding: 2px 10px; font-size: .85rem; font-weight: 700; }
.icone { font: inherit; background: rgba(255,255,255,.25); border: 1px solid rgba(255,255,255,.45); color: inherit; border-radius: 10px; width: 34px; height: 34px; cursor: pointer; }
.icone:hover { background: rgba(255,255,255,.4); }
.drop { display: grid; gap: 10px; padding: 10px; align-content: start; min-height: 120px; border-radius: 0 0 16px 16px; }
.drop.over { background: rgba(47,107,255,.10); }
.card { background: #fff; color: #0a1030; border: 1px solid #dfe4f5; border-radius: 14px; padding: 14px; cursor: pointer; min-width: 0; overflow-wrap: anywhere; }
.card:hover { border-color: #2f6bff; }
.card.arrastando { opacity: .45; }
.card-top { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.card h3 { font-size: 1rem; line-height: 1.25; color: #0a1030; }
.score { flex: 0 0 auto; background: #2f6bff; color: #fff; border-radius: 999px; padding: 3px 10px; font-weight: 800; font-size: .85rem; }
.card .seg { color: #2f6bff; font-size: .88rem; margin-top: 6px; font-weight: 600; }
.card .meta { color: #4a5478; font-size: .85rem; margin-top: 4px; }
.link-wa { color: #1b7f3a; font-weight: 700; text-decoration: none; }
.link-wa:hover { text-decoration: underline; }
.vazio { color: #4a5478; font-size: .9rem; padding: 8px 4px; }
dialog { background: #fff; color: #0a1030; border: 1px solid #dfe4f5; border-radius: 18px; padding: 0; width: min(720px, calc(100vw - 32px)); max-height: calc(100dvh - 40px); box-shadow: 0 30px 80px rgba(10,16,48,.25); }
dialog::backdrop { background: rgba(10,16,48,.45); }
.dlg { display: flex; flex-direction: column; max-height: calc(100dvh - 40px); }
.dlg-h { display: flex; justify-content: space-between; align-items: start; gap: 12px; padding: 20px 22px; border-bottom: 1px solid #dfe4f5; }
.dlg-h h2 { font-size: 1.3rem; color: #0a1030; }
.dlg-b { overflow-y: auto; padding: 20px 22px; display: grid; gap: 22px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.grid2 .full { grid-column: 1 / -1; }
.fl { display: grid; gap: 6px; }
.chat { display: grid; gap: 10px; max-height: 280px; overflow-y: auto; padding: 4px; }
.msg { max-width: 85%; background: #f3f5fc; border: 1px solid #dfe4f5; border-radius: 14px; padding: 10px 12px; }
.msg.eu { justify-self: end; background: #2f6bff; border-color: #2f6bff; color: #fff; }
.msg small { display: block; color: #4a5478; font-size: .75rem; margin-bottom: 4px; }
.msg.eu small { color: #dbe6ff; }
.msg p { white-space: pre-wrap; overflow-wrap: anywhere; }
.envio { display: flex; gap: 10px; margin-top: 10px; }
.envio .inp { flex: 1; }
.dlg-f { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; padding: 16px 22px; border-top: 1px solid #dfe4f5; }
.dlg-f .grupo { display: flex; gap: 10px; flex-wrap: wrap; }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
.adm section { padding-block: 0; }
.prio { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .85rem; margin-top: 8px; color: #0a1030; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 10px; }
.dot.alta { background: #1b7f3a; }
.dot.media { background: #d59b00; }
.dot.baixa { background: #b42318; }
.card-acoes { display: flex; justify-content: flex-end; margin-top: 12px; }
.btn-chat { font: inherit; font-weight: 700; font-size: .85rem; padding: 7px 16px; border-radius: 999px; border: 0; background: #2f6bff; color: #fff; cursor: pointer; }
.btn-chat:hover { background: #0b2bb8; }
.link-zap { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; background: #1b7f3a; color: #fff; border-color: #1b7f3a; }
.link-zap:hover { background: #156a2f; color: #fff; }
.link-zap[hidden] { display: none; }
#dlg-chat { width: min(600px, calc(100vw - 32px)); }

<body>
<header class="hd"><div class="wrap hd-in">
  <a class="brand" href="index.html" aria-label="Sharp Intelligence, início"><img src="assets/sharp-mark.png" alt="" width="29" height="42"><span>Sharp</span></a>
  <span class="muted">CRM</span>
</div></header>

<main class="adm wrap" id="conteudo">
  <section id="login" hidden>
    <h1>Entrar</h1>
    <p class="sub">Acesso restrito à equipe Sharp.</p>
    <form class="box" id="form-login" novalidate style="margin-top:24px">
      <div class="field"><label for="email">E-mail</label><input class="inp" id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="senha">Senha</label><input class="inp" id="senha" type="password" autocomplete="current-password" required></div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn-p" type="submit" id="entrar">Entrar</button>
    </form>
  </section>

  <section id="app" hidden>
    <div class="bar">
      <div>
        <h1>Pipeline de leads</h1>
        <p class="sub" id="contagem"></p>
        <button class="btn-limpar" type="button" id="zerar">Limpar todos os leads</button>
      </div>
      <div class="tools">
        <input class="inp" id="busca" type="search" placeholder="Buscar empresa, ramo, cidade...">
        <button class="btn-s" type="button" id="nova-coluna">Nova coluna</button>
        <label class="btn-s" for="arquivo">Importar planilha</label>
        <input id="arquivo" type="file" accept=".xlsx,.xls,.csv" hidden>
        <button class="btn-s" type="button" id="exportar">Exportar CSV</button>
        <span class="muted" id="usuario"></span>
        <button class="btn-s" type="button" id="sair">Sair</button>
      </div>
    </div>
    <p class="ok" id="ok" role="status"></p>
    <p class="err" id="erro" role="alert"></p>
    <div class="board" id="board"></div>
  </section>
</main>

<dialog id="dlg-lead">
  <div class="dlg">
    <div class="dlg-h">
      <div><h2 id="lead-titulo"></h2><p class="sub" id="lead-sub"></p></div>
      <button class="icone" type="button" id="lead-fechar" aria-label="Fechar">✕</button>
    </div>
    <div class="contato-acoes">
      <div class="botoes">
        <a class="btn-zap" id="lead-wa" href="#" target="_blank" rel="noopener" hidden>WhatsApp</a>
        <a class="btn-ig" id="lead-ig" href="#" target="_blank" rel="noopener" hidden>Instagram</a>
        <a class="btn-maps" id="lead-maps" href="#" target="_blank" rel="noopener">Maps</a>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab on" type="button" data-tab="principal" role="tab">Principal</button>
      <button class="tab" type="button" data-tab="diagnostico" role="tab">Diagnóstico</button>
      <button class="tab" type="button" data-tab="mensagens" role="tab">Mensagens</button>
      <button class="tab" type="button" data-tab="concorrencia" role="tab">Concorrência</button>
      <button class="tab" type="button" data-tab="extras" role="tab">Extras</button>
    </div>
    <div class="dlg-b">
      <form id="form-lead" class="secoes">
        <div class="painel" data-aba="principal" id="painel-principal"></div>
        <div class="painel" data-aba="diagnostico" id="painel-diagnostico" hidden></div>
        <div class="painel" data-aba="mensagens" id="painel-mensagens" hidden></div>
        <div class="painel" data-aba="concorrencia" id="painel-concorrencia" hidden></div>
      </form>
      <div class="painel" data-aba="extras" id="painel-extras" hidden></div>
    </div>
    <div class="dlg-f">
      <button class="btn-s btn-d" type="button" id="lead-excluir">Excluir lead</button>
      <div class="grupo">
        <button class="btn-s" type="button" id="lead-cancelar">Cancelar</button>
        <button class="btn-p" type="button" id="lead-salvar">Salvar alterações</button>
      </div>
    </div>
    <p class="err" id="lead-erro" role="alert" style="padding:0 22px 14px"></p>
  </div>
</dialog>

<dialog id="dlg-chat">
  <div class="dlg">
    <div class="dlg-h">
      <div><h2 id="chat-titulo">Observações</h2><p class="sub" id="chat-sub"></p></div>
      <button class="icone" type="button" id="chat-fechar" aria-label="Fechar">✕</button>
    </div>
    <div class="dlg-b" style="gap:12px">
      <div class="chat" id="chat"></div>
      <form class="envio" id="form-msg">
        <input class="inp" id="msg-texto" type="text" maxlength="2000" placeholder="Escreva uma observação..." autocomplete="off">
        <button class="btn-p" type="submit">Enviar</button>
      </form>
    </div>
  </div>
</dialog>

<dialog id="dlg-zerar">
  <div class="dlg" style="padding:24px;gap:18px">
    <h2 id="zerar-titulo" style="font-size:1.25rem">1 - Tem certeza?</h2>
    <p class="sub" id="zerar-texto">Isso apaga todos os leads e as observações do chat. Não dá para desfazer.</p>
    <p class="err" id="zerar-erro" role="alert"></p>
    <div class="dlg-f" style="padding:0;border:0">
      <button class="btn-s" type="button" id="zerar-nao">Não, cancelar</button>
      <button class="btn-d-forte" type="button" id="zerar-sim">Sim</button>
    </div>
  </div>
</dialog>

<dialog id="dlg-coluna">
  <form method="dialog" class="dlg" id="form-coluna" style="padding:22px;gap:16px">
    <h2 id="coluna-titulo" style="font-size:1.2rem">Nova coluna</h2>
    <label class="fl">Nome da coluna<input class="inp" id="coluna-nome" type="text" maxlength="40" required></label>
    <p class="err" id="coluna-erro" role="alert"></p>
    <div class="dlg-f" style="padding:0;border:0">
      <button class="btn-s btn-d" type="button" id="coluna-excluir" hidden>Excluir coluna</button>
      <div class="grupo">
        <button class="btn-s" type="button" id="coluna-cancelar">Cancelar</button>
        <button class="btn-p" type="submit" id="coluna-salvar">Salvar</button>
      </div>
    </div>
  </form>
</dialog>

  const CSV_COLS = ['rank', 'nome', 'profissional', 'segmento', 'cidade', 'uf', 'endereco', 'telefone', 'instagram', 'nota', 'avaliacoes', 'prioridade', 'score', 'problemas', 'oportunidade'];

  const $ = (id) => document.getElementById(id);

  const numero = (v) => { if (v === '' || v == null) return null; const n = Number(String(v).replace(',', '.')); return Number.isFinite(n) ? n : null; };
  const texto = (v) => (v == null ? null : String(v).trim() || null);

  function waLink(tel, msg) {
    let d = dig(tel);
    if (!d) return null;

  function prioHtml(p) {

  async function carregar() {

  function cardHtml(l) {

      <div class="card-top"><h3>${esc(l.nome)}</h3>${l.score != null ? `<span class="score">${esc(l.score)}</span>` : ''}</div>

      ${l.segmento ? `<p class="seg">${esc(l.segmento)}</p>` : ''}
      ${local ? `<p class="meta">${esc(local)}</p>` : ''}

  function render() {

    const grupos = colunas.map((c) => ({ id: c.id, nome: c.nome, editavel: true }));
    if (leads.some((l) => l.coluna_id == null)) grupos.push({ id: 'none', nome: 'Sem coluna', editavel: false });
    $('board').innerHTML = grupos.map((g, i) => {
      const itens = visiveis.filter((l) => (g.id === 'none' ? l.coluna_id == null : l.coluna_id === g.id));
      const cor = PALETA[i % PALETA.length];
      const acoes = g.editavel ? `<button class="icone" type="button" data-editar-coluna="${esc(g.id)}" aria-label="Editar coluna ${esc(g.nome)}">✎</button>` : '';
      return `<section class="col" data-col="${esc(g.id)}" style="--c:${cor[0]};--t:${cor[1]}">
        <header class="col-h"><h2>${esc(g.nome)}</h2><div class="acoes"><span class="count">${itens.length}</span>${acoes}</div></header>

  async function moverLead(id, colId) {
    const lead = leads.find((l) => String(l.id) === String(id));
    const destino = colId === 'none' ? null : colId;
    if (!lead || lead.coluna_id === destino) return;
    const anterior = lead.coluna_id;
    lead.coluna_id = destino;
    render();
    const { error } = await sb.from('leads').update({ coluna_id: destino, updated_at: new Date().toISOString() }).eq('id', id);

    if (spec.tipo === 'textarea') campo = `<textarea class="inp" name="${spec.id}" rows="3">${esc(valor)}</textarea>`;
    else campo = `<input class="inp" name="${spec.id}" type="${spec.tipo === 'number' ? 'number' : 'text'}"${spec.tipo === 'number' ? ' step="any"' : ''} value="${esc(valor)}">`;
    return `<label class="fl${cls}${dest}">${spec.label}${campo}</label>`;

  const PAINEL = { 'Contato': 'principal', 'Presença digital': 'principal', 'Diagnóstico': 'diagnostico', 'Mensagens': 'mensagens', 'Concorrência': 'concorrencia' };
  function montarPaineis(l) {
    const out = { principal: '', diagnostico: '', mensagens: '', concorrencia: '' };
    let atual = null, grade = '', sec = '';
    const fecha = () => {
      if (atual === null) return;
      if (grade) { sec += `<div class="grid2">${grade}</div>`; grade = ''; }
      if (sec) { out[atual] += sec + '</div>'; sec = ''; }
    };
    SECOES.forEach((spec) => {
      if (spec.sec) {
        fecha();
        atual = PAINEL[spec.sec];
        sec = `<div class="sec"><h3>${spec.sec}</h3>`;
      } else {
        grade += campoHtml(spec, valorDe(l, spec));
      }
    });
    fecha();
    return out;
  }

  function montarExtras(l) {
    const itens = EXTRAS.map(([rotulo, src, chave, tipo]) => {

      return `<div><dt>${esc(rotulo)}</dt><dd>${val}</dd></div>`;

  // ----- Importação (trouxa.xlsx ou planilha de leads) -----
  // Lê a planilha célula a célula: guarda todas as colunas e o link do Google Maps (hiperlink).
  function lerLinhas(ws) {
    const faixa = XLSX.utils.decode_range(ws['!ref']);
    const cabecalho = {};
    for (let c = faixa.s.c; c <= faixa.e.c; c++) {
      const cel = ws[XLSX.utils.encode_cell({ r: faixa.s.r, c })];
      if (cel && cel.v !== undefined) cabecalho[c] = String(cel.v).trim();
    }
    const linhas = [];
    for (let r = faixa.s.r + 1; r <= faixa.e.r; r++) {
      const dados = {};
      let maps = null;
      Object.entries(cabecalho).forEach(([c, nome]) => {
        const cel = ws[XLSX.utils.encode_cell({ r, c: Number(c) })];
        dados[nome] = cel && cel.v !== undefined ? String(cel.v) : '';
        if (/maps/i.test(nome) && cel && cel.l && cel.l.Target) maps = cel.l.Target;
      });
      if (Object.values(dados).some((v) => v !== '')) { dados.__maps = maps; linhas.push(dados); }
    }
    return linhas;
  }

  function mapear(r) {
    const o = { dados: { ...r } };
    delete o.dados.__maps;
    for (const [campo, coluna] of Object.entries(MAPA)) {
      const v = r[coluna];
      if (['rank', 'avaliacoes', 'score'].includes(campo)) o[campo] = numero(v) == null ? null : Math.round(numero(v));
      else if (campo === 'nota') o[campo] = numero(v);
      else o[campo] = texto(v);
    }
    o.maps = r.__maps || null;
    return o;
  }

  $('arquivo').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    avisar('ok', 'Lendo a planilha...');
    try {
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: false });
      const aba = wb.SheetNames.includes('LEADS') ? 'LEADS' : wb.SheetNames[0];
      const linhas = lerLinhas(wb.Sheets[aba]);
      const porChave = new Map();
      linhas.map(mapear).filter((r) => r.nome).forEach((r) => porChave.set((r.nome + '|' + (r.cidade || '')).toLowerCase(), r));
      const registros = [...porChave.values()];
      if (!registros.length) { avisar('erro', 'Nenhum lead encontrado na aba ' + aba + '.', true); return; }
      for (let i = 0; i < registros.length; i += 200) {
        const { error } = await sb.from('leads').upsert(registros.slice(i, i + 200), { onConflict: 'nome,cidade' });
        if (error) { avisar('erro', 'Erro ao importar: ' + error.message, true); return; }
      }
      avisar('ok', registros.length + ' leads importados. Colunas, status e observações foram mantidos.');
      await carregar();
    } catch (err) {
      avisar('erro', 'Não foi possível ler o arquivo: ' + err.message, true);
    }
  });

  // ----- Exportação em CSV -----
  $('exportar').addEventListener('click', () => {
    const cel = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const nomeColuna = (id) => (colunas.find((c) => c.id === id) || {}).nome || '';
    const cab = [...CSV_COLS, 'coluna'];
    const linhas = [cab.join(';')].concat(leads.map((l) => [...CSV_COLS.map((c) => l[c]), nomeColuna(l.coluna_id)].map(cel).join(';')));
    const blob = new Blob(['﻿' + linhas.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'leads-sharp.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  // ----- Login -----
  $('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('err').textContent = '';
    $('entrar').disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('senha').value });
    $('entrar').disabled = false;
    if (error || !data.session) { $('err').textContent = 'E-mail ou senha inválidos.'; return; }
    $('senha').value = '';
    entrar(data.session.user);
  });

  function entrar(user) {
    usuario = user;
    mostrar(true, user.email);
    ouvirChat();
  }

  $('sair').addEventListener('click', async () => { await sb.auth.signOut(); leads = []; colunas = []; usuario = null; mostrar(false); });

  sb.auth.getSession().then(({ data }) => { if (data.session) entrar(data.session.user); else mostrar(false); });
})();
</script>
</body>
</html>
