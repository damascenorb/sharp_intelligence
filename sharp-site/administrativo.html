<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Área administrativa | Sharp Intelligence</title>
<meta name="theme-color" content="#050b1e">
<link rel="icon" type="image/png" href="assets/sharp-mark-dark.png">
<link rel="stylesheet" href="styles.css">
<style>
.adm { padding-block: 48px 80px; }
.adm h1 { font-size: clamp(1.8rem, 1.2rem + 2vw, 2.6rem); margin-bottom: 8px; }
.adm .sub { color: var(--mute); margin-bottom: 28px; }
.box { background: var(--bg2); border: 1px solid var(--line); border-radius: 18px; padding: 24px; max-width: 420px; }
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field label { font-weight: 700; font-size: .95rem; }
.field input { font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); min-height: 44px; }
.err { color: #ff9b9b; min-height: 1.4em; margin-bottom: 8px; }
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: rgba(255,255,255,.04); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--mute); }
td select { font: inherit; padding: 8px 10px; border-radius: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line); }
.muted { color: var(--mute); }
</style>
</head>
<body>
<header class="hd"><div class="wrap hd-in">
  <a class="brand" href="index.html" aria-label="Sharp Intelligence, início"><img src="assets/sharp-mark.png" alt="" width="29" height="42"><span>Sharp</span></a>
  <span class="muted">Área administrativa</span>
</div></header>

<main class="adm wrap" id="conteudo">
  <section id="login" hidden>
    <h1>Entrar</h1>
    <p class="sub">Acesso restrito à equipe Sharp.</p>
    <form class="box" id="form-login" novalidate>
      <div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn btn-y" type="submit" id="entrar">Entrar</button>
    </form>
  </section>

  <section id="app" hidden>
    <div class="bar">
      <div><h1>Leads</h1><p class="sub" id="contagem"></p></div>
      <div><span class="muted" id="usuario"></span> <button class="btn btn-o" type="button" id="sair">Sair</button></div>
    </div>
    <div class="tw">
      <table>
        <thead><tr><th>#</th><th>Nome</th><th>Cidade</th><th>Telefone</th><th>Instagram</th><th>Problema</th><th>Status</th></tr></thead>
        <tbody id="linhas"></tbody>
      </table>
    </div>
    <p class="err" id="erro-app" role="alert"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
  const SUPABASE_URL = 'https://zvvoaxscemmjrsqpfxsx.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_By1V1tGjx-Tc_ocuDVl9Sg_99Ij7U8N';
  const STATUS = ['Novo', 'Contato', 'Proposta', 'Fechado', 'Descartado'];
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function mostrar(logado, email) {
    $('login').hidden = logado;
    $('app').hidden = !logado;
    if (logado) { $('usuario').textContent = email; carregar(); }
  }

  async function carregar() {
    $('erro-app').textContent = '';
    const { data, error } = await sb.from('leads').select('*').order('rank', { ascending: true });
    if (error) { $('erro-app').textContent = 'Não foi possível carregar os leads: ' + error.message; return; }
    $('contagem').textContent = data.length + ' leads';
    $('linhas').innerHTML = data.map((l) => `
      <tr>
        <td>${esc(l.rank)}</td>
        <td><strong>${esc(l.nome)}</strong><br><span class="muted">${esc(l.segmento)}</span></td>
        <td>${esc(l.cidade)}${l.uf ? ' - ' + esc(l.uf) : ''}</td>
        <td>${esc(l.telefone)}</td>
        <td>${esc(l.instagram)}</td>
        <td>${esc(l.problemas)}</td>
        <td><select data-id="${esc(l.id)}">${STATUS.map((s) => `<option${s === l.status ? ' selected' : ''}>${s}</option>`).join('')}</select></td>
      </tr>`).join('');
  }

  $('linhas').addEventListener('change', async (e) => {
    if (!e.target.matches('select[data-id]')) return;
    const { error } = await sb.from('leads').update({ status: e.target.value, updated_at: new Date().toISOString() }).eq('id', e.target.dataset.id);
    $('erro-app').textContent = error ? 'Não foi possível salvar: ' + error.message : '';
  });

  $('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('err').textContent = '';
    $('entrar').disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('senha').value });
    $('entrar').disabled = false;
    if (error || !data.session) { $('err').textContent = 'E-mail ou senha inválidos.'; return; }
    $('senha').value = '';
    mostrar(true, data.session.user.email);
  });

  $('sair').addEventListener('click', async () => { await sb.auth.signOut(); mostrar(false); });

  sb.auth.getSession().then(({ data }) => {
    if (data.session) mostrar(true, data.session.user.email); else mostrar(false);
  });
})();
</script>
</body>
</html>
