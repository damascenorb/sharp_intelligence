<body style="margin:0;overflow:hidden"><iframe id="f" style="width:var(--w,1440px);height:var(--h,900px);border:0"></iframe>
<script>const q=new URLSearchParams(location.search);const r=document.documentElement.style;r.setProperty('--w',(q.get('w')||1440)+'px');r.setProperty('--h',(q.get('h')||900)+'px');f.src='../'+(q.get('p')||'index.html');
f.onload=()=>setTimeout(()=>{const d=f.contentDocument;d.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));if(q.get('c'))d.querySelector(q.get('c')).click();setTimeout(()=>f.contentWindow.scrollTo({top:+q.get('y')||0,behavior:'instant'}),400)},800)</script>
